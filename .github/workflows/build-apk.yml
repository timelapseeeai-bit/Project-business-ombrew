name: Build OmbrewBusiness v5.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OmbrewBusiness-v5.1-android-project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q 'OmbrewBusiness-v5.1-android-project.zip' -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/OmbrewBusiness-v5.1 assembleDebug \
            --no-daemon \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Dkotlin.compiler.execution.strategy=in-process
